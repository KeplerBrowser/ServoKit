name: Feature request
description: Suggest an improvement to ServoKit.
labels: [enhancement, rfc]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would you like to solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What supported behavior or engineering guarantee becomes true? Cleanup, file edits, and evidence collection are delivery work, not the outcome.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: proof-artifacts
    attributes:
      label: Tracked proof artifacts
      description: If this adds a harness or readiness check, name the supported guarantee, owning layer, and rerun trigger. Leave blank for one-time evidence, which belongs in the issue or PR.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternatives you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or screenshots here.
