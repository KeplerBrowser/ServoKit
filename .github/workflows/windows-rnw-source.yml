name: Windows RNW Source

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: MSBuild/Cargo profile to validate
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
  pull_request:
    paths:
      - ".github/workflows/windows-rnw-source.yml"
      - "ARCHITECTURE.md"
      - "bun.lock"
      - "docs/react-native-servokit.md"
      - "docs/readiness-checks.md"
      - "packages/react-native-servokit/**"
      - "scripts/windows-rnw-smoke.ps1"
      - "scripts/windows-rnw-source.ps1"
      - "scripts/windows-rust-staticlib-link.ps1"

permissions:
  contents: read

jobs:
  rnw-source:
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run package checks
        run: |
          bun run --cwd packages/react-native-servokit typecheck
          bun test packages/react-native-servokit/src/__tests__/windows-fabric-source-routing.test.ts packages/react-native-servokit/src/__tests__/package-platform-contract.test.ts

      - name: Run Windows RNW source evidence
        shell: pwsh
        run: |
          $configuration = "${{ inputs.configuration || 'Release' }}"
          ./scripts/windows-rnw-source.ps1 -Configuration $configuration -EvidenceDir "$env:RUNNER_TEMP\servokit-windows-rnw-source"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ServoKit-Windows-RNW-source-evidence
          path: ${{ runner.temp }}\servokit-windows-rnw-source\*
          if-no-files-found: warn
