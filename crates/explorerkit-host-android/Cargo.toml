[lib]
name = "explorerkit_host_android"
crate-type = ["cdylib", "rlib"]

[package]
name = "explorerkit-host-android"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "1"
explorerkit-embedder = { path = "../explorerkit-embedder", features = ["servo"] }
explorerkit-host = { path = "../explorerkit-host" }

[target.'cfg(target_os = "android")'.dependencies]
dpi = { workspace = true }
jni = { workspace = true }
raw-window-handle = { workspace = true }
servo = { workspace = true }
