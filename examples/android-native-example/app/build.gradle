plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def explorerkitRootDir = projectDir.canonicalFile.parentFile.parentFile.parentFile
def sharedFixtureSourceDir = new File(explorerkitRootDir, "examples/fixtures")
def generatedFixtureAssetsDir = file("$buildDir/generated/explorerkit-fixtures/assets")
def generatedFixtureAssetRoot = file("$generatedFixtureAssetsDir/explorerkit-fixtures")

tasks.register("syncFixtureAssets", Sync) {
    from(sharedFixtureSourceDir)
    into(generatedFixtureAssetRoot)
}

android {
    namespace "com.kepler.explorerkit.androidexample"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.kepler.explorerkit.androidexample"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    sourceSets {
        main {
            assets.srcDir generatedFixtureAssetsDir
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
}

tasks.named("preBuild").configure {
    dependsOn("syncFixtureAssets")
}

dependencies {
    implementation project(":explorerkit-host-android")
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
