<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Servo dialog demo</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
      }

      .card {
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin-top: 0;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 16px;
      }

      button {
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: #eff6ff;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 600;
      }

      pre {
        margin-top: 20px;
        padding: 12px;
        border-radius: 10px;
        background: #e2e8f0;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Servo dialog demo</h1>
      <p>
        These buttons trigger <code>alert()</code>, <code>confirm()</code>, and
        <code>prompt()</code> so the example app can demonstrate React
        Native-owned JavaScript dialogs.
      </p>
      <div class="actions">
        <button id="alert-button" type="button">Alert</button>
        <button id="confirm-button" type="button">Confirm</button>
        <button id="prompt-button" type="button">Prompt</button>
      </div>
      <pre id="output">Dialog output will appear here.</pre>
    </div>
    <script>
      const output = document.getElementById("output");

      function updateOutput(message) {
        output.textContent = message;
        document.title = message;
      }

      document
        .getElementById("alert-button")
        .addEventListener("click", () => {
          window.alert("Servo says hello from alert().");
          updateOutput("Alert completed");
        });

      document
        .getElementById("confirm-button")
        .addEventListener("click", () => {
          const confirmed = window.confirm("Should Servo continue?");
          updateOutput(confirmed ? "Confirm accepted" : "Confirm cancelled");
        });

      document
        .getElementById("prompt-button")
        .addEventListener("click", () => {
          const response = window.prompt(
            "What should Servo name this tab?",
            "Servo",
          );
          updateOutput(
            response === null ? "Prompt cancelled" : `Prompt: ${response}`,
          );
        });
    </script>
  </body>
</html>
